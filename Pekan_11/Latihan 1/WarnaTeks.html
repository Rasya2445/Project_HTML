<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubah Warna Teks</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg, #667eea, #764ba2);
    }

    .container{
        background:white;
        padding:40px;
        border-radius:20px;
        text-align:center;
        box-shadow:0 10px 25px rgba(0,0,0,0.2);
        width:400px;
    }

    h1{
        margin-bottom:20px;
        color:#333;
    }

    #teks{
        font-size:28px;
        font-weight:bold;
        margin-bottom:25px;
        transition:0.4s;
    }

    button{
        background:#667eea;
        color:white;
        border:none;
        padding:12px 25px;
        font-size:16px;
        border-radius:10px;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#764ba2;
        transform:scale(1.05);
    }
</style>
</head>

<body>

<div class="container">
    <h1>Ubah Warna Teks</h1>

    <p id="teks">Klik tombol di bawah!</p>

    <button onclick="ubahWarna()">
        🎨 Ubah Warna
    </button>
</div>

<script>
function ubahWarna() {
    let warna = [
        "red",
        "blue",
        "green",
        "orange",
        "purple",
        "deeppink",
        "gold",
        "teal"
    ];

    let acak = Math.floor(Math.random() * warna.length);

    document.getElementById("teks").style.color = warna[acak];
}
</script>

</body>
</html>
