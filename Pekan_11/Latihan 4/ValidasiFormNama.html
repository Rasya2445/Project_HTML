<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validasi Form Nama</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#11998e,#38ef7d);
        }

        .container{
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 20px rgba(0,0,0,0.2);
            width:350px;
            text-align:center;
        }

        h1{
            margin-bottom:20px;
            color:#333;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            margin-bottom:15px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#11998e;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#0d7d74;
        }

        #pesan{
            margin-top:15px;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Validasi Nama</h1>

    <input type="text" id="nama" placeholder="Masukkan nama">

    <button onclick="validasiNama()">
        Periksa
    </button>

    <p id="pesan"></p>
</div>

<script>
function validasiNama() {
    let nama = document.getElementById("nama").value;
    let pesan = document.getElementById("pesan");

    if (nama.trim() === "") {
        pesan.innerHTML = "❌ Nama tidak boleh kosong!";
        pesan.style.color = "red";
    } else {
        pesan.innerHTML = "✅ Nama valid: " + nama;
        pesan.style.color = "green";
    }
}
</script>

</body>
</html>
