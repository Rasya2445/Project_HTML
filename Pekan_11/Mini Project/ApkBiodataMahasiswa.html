<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi Biodata Mahasiswa</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.container{
    width:450px;
    background:#fff;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#333;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
    color:#555;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#4facfe;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#008cff;
}

.hasil{
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    background:#f5f5f5;
    display:none;
}

.hasil h3{
    margin-bottom:10px;
    color:#333;
}

.hasil p{
    margin:8px 0;
    color:#444;
}
</style>
</head>
<body>

<div class="container">
    <h1>🎓 Biodata Mahasiswa</h1>

    <div class="form-group">
        <label>Nama Mahasiswa</label>
        <input type="text" id="nama" placeholder="Masukkan Nama">
    </div>

    <div class="form-group">
        <label>NIM</label>
        <input type="text" id="nim" placeholder="Masukkan NIM">
    </div>

    <div class="form-group">
        <label>Jurusan</label>
        <input type="text" id="jurusan" placeholder="Masukkan Jurusan">
    </div>

    <div class="form-group">
        <label>Fakultas</label>
        <input type="text" id="fakultas" placeholder="Masukkan Fakultas">
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Masukkan Email">
    </div>

    <button onclick="tampilkanData()">
        Tampilkan Biodata
    </button>

    <div class="hasil" id="hasil">
        <h3>Data Mahasiswa</h3>
        <p id="outputNama"></p>
        <p id="outputNim"></p>
        <p id="outputJurusan"></p>
        <p id="outputFakultas"></p>
        <p id="outputEmail"></p>
    </div>
</div>

<script>
function tampilkanData() {

    let nama = document.getElementById("nama").value;
    let nim = document.getElementById("nim").value;

    if(nama === "" || nim === ""){
        alert("Nama dan NIM harus diisi!");
        return;
    }

    document.getElementById("outputNama").innerHTML =
        "<b>Nama :</b> " + nama;

    document.getElementById("outputNim").innerHTML =
        "<b>NIM :</b> " + nim;

    document.getElementById("outputJurusan").innerHTML =
        "<b>Jurusan :</b> Teknik Informatika";

    document.getElementById("outputFakultas").innerHTML =
        "<b>Fakultas :</b> Fakultas Ilmu Komputer";

    document.getElementById("outputEmail").innerHTML =
        "<b>Email :</b> mahasiswa@email.com";

    document.getElementById("hasil").style.display = "block";
}
</script>

</body>
</html>
