<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Penjumlahan</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#36d1dc,#5b86e5);
        }

        .container{
            background:white;
            padding:30px;
            width:350px;
            border-radius:15px;
            box-shadow:0 10px 20px rgba(0,0,0,0.2);
            text-align:center;
        }

        h1{
            color:#333;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            background:#5b86e5;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#3d6dd8;
            transform:scale(1.03);
        }

        #hasil{
            margin-top:20px;
            font-size:20px;
            font-weight:bold;
            color:#333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧮 Kalkulator Penjumlahan</h1>

        <input type="number" id="angka1" placeholder="Masukkan angka pertama">

        <input type="number" id="angka2" placeholder="Masukkan angka kedua">

        <button onclick="hitungJumlah()">
            Hitung Jumlah
        </button>

        <div id="hasil"></div>
    </div>

    <script>
        function hitungJumlah() {
            let angka1 = parseFloat(document.getElementById("angka1").value);
            let angka2 = parseFloat(document.getElementById("angka2").value);

            let jumlah = angka1 + angka2;

            document.getElementById("hasil").innerHTML =
                "Hasil Penjumlahan: " + jumlah;
        }
    </script>

</body>
</html>
