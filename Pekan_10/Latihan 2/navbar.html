<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navbar Flexbox</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background-color:#2c3e50;
    padding:15px 50px;
}

.logo{
    color:white;
    font-size:24px;
    font-weight:bold;
}

.nav-links{
    display:flex;
    list-style:none;
}

.nav-links li{
    margin-left:25px;
}

.nav-links a{
    text-decoration:none;
    color:white;
    font-size:16px;
    transition:0.3s;
}

.nav-links a:hover{
    color:#1abc9c;
}

.btn{
    background:#1abc9c;
    color:white;
    padding:8px 15px;
    border-radius:5px;
}

.btn:hover{
    background:#16a085;
    color:white;
}
</style>
</head>
<body>

<nav>
    <div class="logo">MyWebsite</div>

    <ul class="nav-links">
        <li><a href="#">Beranda</a></li>
        <li><a href="#">Profil</a></li>
        <li><a href="#">Galeri</a></li>
        <li><a href="#">Kontak</a></li>
        <li><a href="#" class="btn">Login</a></li>
    </ul>
</nav>

</body>
</html>
