<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Foto Grid</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background-color: #868686;
            padding: 20px;
        }

        h1{
            text-align: center;
            margin-bottom: 20px;
            color: #000000;
        }

        .gallery{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .gallery-item{
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            background: white;
            transition: transform 0.3s;
        }

        .gallery-item:hover{
            transform: scale(1.05);
        }

        .gallery-item img{
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .caption{
            padding: 10px;
            text-align: center;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>Galeri Foto</h1>

    <div class="gallery">

        <div class="gallery-item">
            <img src="https://asset.kompas.com/crops/PZkNa1XEcC9huIv3Gd1tHebvzIA=/0x0:780x520/1200x800/data/photo/2023/07/25/64bf6a78dfe73.jpg" alt="Foto 1">
            <div class="caption">Pemandangan Alam</div>
        </div>

        <div class="gallery-item">
            <img src="https://www.eigeradventure.com/blog/wp-content/uploads/2024/03/keindahan-alam-di-indonesia-1.jpg" alt="Foto 2">
            <div class="caption">Pegunungan</div>
        </div>

        <div class="gallery-item">
            <img src="https://raja-wisata.com/wp-content/uploads/2019/11/pantai-pink-pulau-komodo.jpg" alt="Foto 3">
            <div class="caption">Pantai Indah</div>
        </div>

        <div class="gallery-item">
            <img src="https://asset.kompas.com/crops/FxtQ6mikxyXeTrzkZvV0IwjD9zA=/0x0:4032x2688/1200x800/data/photo/2023/11/08/654b56ee6f497.jpg" alt="Foto 4">
            <div class="caption">Hutan Hijau</div>
        </div>

        <div class="gallery-item">
            <img src="https://www.ancol.com/blog/wp-content/uploads/2025/10/burung-elang-jawa-jbl-ancol.jpg" alt="Foto 5">
            <div class="caption">Burung Elang</div>
        </div>

        <div class="gallery-item">
            <img src="https://asset.kompas.com/crops/dHP0AXmLII_0tzKsIJpc3z7z1Q4=/42x0:572x353/750x500/data/photo/2023/05/03/64523c4336b16.jpeg" alt="Foto 6">
            <div class="caption">Danau Biru</div>
        </div>

    </div>

</body>
</html>
