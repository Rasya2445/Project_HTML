<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Menu Makanan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🍽️ Daftar Menu Makanan</h1>
        <p>Selamat Datang di Restoran RSY Nusantara</p>
    </header>

    <div class="container">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=500" alt="Pizza">
            <h2>Pizza</h2>
            <p>Pizza keju dengan topping lengkap.</p>
            <span>Rp 50.000</span>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1604908176997-4317dcc5f36d?w=500" alt="Burger">
            <h2>Burger</h2>
            <p>Burger daging sapi premium.</p>
            <span>Rp 35.000</span>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1512058564366-18510be2db19?w=500" alt="Mie Ayam">
            <h2>Mie Ayam</h2>
            <p>Mie ayam khas Indonesia.</p>
            <span>Rp 20.000</span>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1516684732162-798a0062be99?w=500" alt="Nasi Goreng">
            <h2>Nasi Goreng</h2>
            <p>Nasi goreng spesial dengan telur.</p>
            <span>Rp 25.000</span>
        </div>

    </div>

</body>
</html>
